name: Build Android TV APK
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: android-build
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7
      - name: Build and lint APK
        run: |
          ./gradlew --no-daemon :app:assembleDebug :app:lintDebug || { cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt; exit 1; }
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MiYingTV-v0.4-AndroidTV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MiYingTV-v0.4-AndroidTV-APK
          path: MiYingTV-v0.4-AndroidTV.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-reports
          path: app/build/reports/
