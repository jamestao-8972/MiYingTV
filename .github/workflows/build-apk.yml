name: Build Android TV APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        if: hashFiles('app/build.gradle') == ''
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = {
          'settings.gradle': "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\nrootProject.name='MiYingTV'\ninclude ':app'\n",
          'build.gradle': "plugins { id 'com.android.application' version '8.6.1' apply false }\n",
          'gradle.properties': 'android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2048m\n',
          '.gitignore': '.gradle/\nlocal.properties\n**/build/\n',
          'app/build.gradle': "plugins { id 'com.android.application' }\nandroid { namespace 'com.miying.tv'; compileSdk 35; defaultConfig { applicationId 'com.miying.tv'; minSdk 23; targetSdk 35; versionCode 4; versionName '0.4' }; compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 } }\ndependencies { implementation 'androidx.media3:media3-exoplayer:1.4.1'; implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'; implementation 'androidx.media3:media3-ui:1.4.1' }\n",
          'app/src/main/AndroidManifest.xml': '''<manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><uses-feature android:name="android.software.leanback" android:required="true"/><uses-feature android:name="android.hardware.touchscreen" android:required="false"/><application android:theme="@android:style/Theme.Material.NoActionBar" android:label="米影 TV" android:banner="@drawable/tv_banner" android:icon="@drawable/tv_banner" android:usesCleartextTraffic="true"><activity android:name=".MainActivity" android:exported="true" android:screenOrientation="landscape" android:configChanges="keyboard|keyboardHidden|navigation|orientation|screenSize"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LEANBACK_LAUNCHER"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>''',
          'app/src/main/res/drawable/tv_banner.xml': '''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="320dp" android:height="180dp" android:viewportWidth="320" android:viewportHeight="180"><path android:fillColor="#111723" android:pathData="M0,0h320v180h-320z"/><path android:fillColor="#3F83F8" android:pathData="M125,45L205,90L125,135z"/></vector>''',
          'README.md': '''# 米影 TV 0.4
          Android TV 遥控器播放器，Android 6.0+。支持 HTTP/HTTPS M3U 播放列表、MP4、HLS (M3U8)、收藏和播放进度。方向键导航、确定键选择、菜单显示控制、返回回首页。
          内置 Big Buck Bunny：© Blender Foundation，CC BY 3.0，https://peach.blender.org/ 。直播及其他影片需导入本人有权观看的地址，不包含付费破解或未经授权的聚合源。
          JDK17 / Gradle8.7 / SDK35。运行 ./gradlew :app:assembleDebug。Actions 输出已签名的个人测试 APK。目标 Redmi A65 2025 的遥控器、解码和网络仍需实机验证。
          ''',
          'app/src/main/java/com/miying/tv/MainActivity.java': '''package com.miying.tv;
          import android.app.*;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.*;
          import android.widget.*;
          import android.content.SharedPreferences;
          import androidx.media3.common.*;
          import androidx.media3.exoplayer.ExoPlayer;
          import androidx.media3.ui.PlayerView;
          import java.io.*;
          import java.net.*;
          import java.util.*;
          @android.annotation.SuppressLint("UnsafeOptInUsageError")
          public class MainActivity extends Activity {
            LinearLayout list; ExoPlayer player; PlayerView video; String current=""; boolean playing=false; int generation=0;
            SharedPreferences prefs(){return getSharedPreferences("miying_prefs",MODE_PRIVATE);}
            public void onCreate(Bundle b){super.onCreate(b);home();}
            TextView label(String text,int size){TextView t=new TextView(this);t.setText(text);t.setTextSize(size);t.setTextColor(Color.WHITE);t.setPadding(24,12,24,12);return t;}
            Button button(LinearLayout parent,String text,Runnable action){Button b=new Button(this);b.setText(text);b.setAllCaps(false);b.setMinHeight(52);b.setOnFocusChangeListener((v,f)->{v.setScaleX(f?1.02f:1f);v.setScaleY(f?1.02f:1f);});b.setOnClickListener(v->action.run());parent.addView(b);return b;}
            void home(){playing=false;generation++;LinearLayout root=new LinearLayout(this);root.setOrientation(1);root.setPadding(32,24,32,24);root.setBackgroundColor(Color.rgb(17,23,35));setContentView(root);
              root.addView(label("米影 TV · 直播 / 免费授权影视",26));
              ScrollView scroll=new ScrollView(this);LinearLayout content=new LinearLayout(this);content.setOrientation(1);scroll.addView(content);root.addView(scroll,new LinearLayout.LayoutParams(-1,0,1));
              Button first=button(content,"导入直播 / 影片列表（M3U 地址）",()->ask(true));
              button(content,"播放单个视频（MP4 / M3U8 地址）",()->ask(false));
              button(content,"免费影片 · Big Buck Bunny",()->play("https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"));
              content.addView(label("© Blender Foundation · CC BY 3.0；直播需导入有权观看的片源。",14));
              String last=prefs().getString("last_url","");button(content,"继续上次播放",()->play(last)).setEnabled(!last.isEmpty());
              String fav=prefs().getString("favorite_url","");button(content,"播放收藏",()->play(fav)).setEnabled(!fav.isEmpty());
              content.addView(label("我的频道 / 影片",22));list=new LinearLayout(this);list.setOrientation(1);content.addView(list);
              String saved=prefs().getString("playlist","");if(!saved.isEmpty())load(saved);else list.addView(label("尚无列表，请导入合法公开直播或个人媒体地址。",18));first.requestFocus();
            }
            boolean valid(String u){try{URI x=new URI(u);return x.getHost()!=null && ("https".equalsIgnoreCase(x.getScheme())||"http".equalsIgnoreCase(x.getScheme()));}catch(Exception e){return false;}}
            void ask(boolean playlist){EditText input=new EditText(this);input.setSingleLine(true);input.setInputType(17);input.setHint("https://...");AlertDialog dialog=new AlertDialog.Builder(this).setTitle(playlist?"M3U 播放列表地址":"MP4 / M3U8 视频地址").setView(input).setPositiveButton("确定",null).setNegativeButton("取消",null).create();dialog.setOnShowListener(d->dialog.getButton(-1).setOnClickListener(v->{String url=input.getText().toString().trim();if(!valid(url)){toast("请输入有效的 HTTP / HTTPS 地址");return;}dialog.dismiss();if(playlist){prefs().edit().putString("playlist",url).apply();load(url);}else play(url);}));dialog.show();}
            void load(String url){final int request=++generation;list.removeAllViews();list.addView(label("正在加载…",18));new Thread(()->{ArrayList<String[]> rows=new ArrayList<>();String failure=null;HttpURLConnection c=null;
              try{c=(HttpURLConnection)new URL(url).openConnection();c.setConnectTimeout(10000);c.setReadTimeout(15000);if(c.getContentLengthLong()>2000000)throw new IOException("列表超过 2MB");
                try(BufferedReader r=new BufferedReader(new InputStreamReader(c.getInputStream(),"UTF-8"))){String line,name="";int chars=0,count=0;while((line=r.readLine())!=null){chars+=line.length();if(chars>1000000||++count>15000)throw new IOException("列表过大");line=line.replace("\uFEFF","").trim();if(line.startsWith("#EXTINF:")){int comma=line.indexOf(',');name=comma>=0?line.substring(comma+1):"未命名";}else if(!line.isEmpty()&&!line.startsWith("#")){String resolved=new URL(c.getURL(),line).toString();if(valid(resolved))rows.add(new String[]{name.isEmpty()?"频道 "+(rows.size()+1):name,resolved});name="";if(rows.size()>=500)break;}}}
              }catch(Exception e){failure=e.getMessage();}finally{if(c!=null)c.disconnect();}final String error=failure;runOnUiThread(()->{if(request!=generation||playing||isFinishing())return;list.removeAllViews();if(error!=null)list.addView(label("加载失败："+error,18));else if(rows.isEmpty())list.addView(label("未找到有效频道。请导入 M3U 列表，M3U8 视频请用单个视频播放。",18));for(String[] row:rows)button(list,row[0],()->play(row[1]));});}).start();}
            void play(String url){if(!valid(url)){toast("无有效地址");return;}release();current=url;playing=true;generation++;prefs().edit().putString("last_url",url).apply();player=new ExoPlayer.Builder(this).build();video=new PlayerView(this);video.setPlayer(player);video.setUseController(true);video.setShowBuffering(PlayerView.SHOW_BUFFERING_WHEN_PLAYING);video.setKeepScreenOn(true);
              FrameLayout frame=new FrameLayout(this);frame.addView(video,new FrameLayout.LayoutParams(-1,-1));Button star=new Button(this);star.setText("★ 收藏");frame.addView(star,new FrameLayout.LayoutParams(-2,-2,Gravity.TOP|Gravity.RIGHT));star.setOnClickListener(v->{prefs().edit().putString("favorite_url",current).apply();toast("已收藏");});setContentView(frame);video.requestFocus();
              player.addListener(new Player.Listener(){public void onPlayerError(PlaybackException e){new AlertDialog.Builder(MainActivity.this).setTitle("播放失败").setMessage("片源失效、网络受限或格式不支持："+e.getErrorCodeName()).setPositiveButton("重试",(d,w)->play(current)).setNegativeButton("首页",(d,w)->{release();home();}).show();}});
              player.setMediaItem(MediaItem.fromUri(url));player.prepare();long pos=prefs().getLong("pos_"+url,0);if(pos>0)player.seekTo(pos);player.play();
            }
            void release(){if(player!=null){prefs().edit().putLong("pos_"+current,player.isCurrentMediaItemLive()?0:Math.max(0,player.getCurrentPosition())).apply();player.release();player=null;}}
            public boolean onKeyDown(int code,KeyEvent e){if(player!=null){if(code==KeyEvent.KEYCODE_MENU){video.showController();return true;}if(code==KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE){if(player.isPlaying())player.pause();else player.play();return true;}if(code==KeyEvent.KEYCODE_MEDIA_PLAY){player.play();return true;}if(code==KeyEvent.KEYCODE_MEDIA_PAUSE){player.pause();return true;}}return super.onKeyDown(code,e);}
            public void onBackPressed(){if(playing){release();home();}else super.onBackPressed();}
            protected void onStart(){super.onStart();if(playing&&player==null)play(current);}
            protected void onStop(){release();super.onStop();}
            protected void onDestroy(){release();super.onDestroy();}
            void toast(String text){Toast.makeText(this,text,Toast.LENGTH_LONG).show();}
          }
          '''}
          for name,text in files.items():
            path=Path(name);path.parent.mkdir(parents=True,exist_ok=True);path.write_text(text,encoding='utf-8')
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7
      - name: Build and lint APK
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MiYingTV-v0.4-AndroidTV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MiYingTV-v0.4-AndroidTV-APK
          path: MiYingTV-v0.4-AndroidTV.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-reports
          path: app/build/reports/
